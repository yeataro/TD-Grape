<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TD-Grape · React TOP Editor</title></head>
<!-- Until the editor's code has loaded, the waiting mark (icons.tsx BrandMark, wave); the stylesheet comes before the code, so
     it moves at once (Refactor.68.6, human 2026-10-10). The drawing must match BrandMark (a test checks it); width and height
     only matter if the stylesheet is late. 編輯器程式載入前顯示等待中的標誌（BrandMark，wave）；樣式表比程式先到，所以一開就會動。
     圖必須和 BrandMark 一致（有測試檢查）；寬高只在樣式表還沒到時有用。 -->
<body><div id="root"><div class="boot-screen"><svg class="brand-mark loading loading-wave" viewBox="0 0 64 64" width="48" height="48" role="img" aria-label="TD-Grape" aria-busy="true">
<g><circle cx="20" cy="23" r="11" fill="#bfa5f4" /><circle cx="44" cy="23" r="11" fill="#a98be2" /><circle cx="32" cy="44" r="11" fill="#b499ef" /></g></svg></div></div>
<script src="/grape_core.js"></script><script type="module" src="./main.tsx"></script></body></html>
